document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"15d6cdeb-8185-45ac-b500-55872fa364cd\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml,body{margin:0;padding:0;background:#f8fafc;color:#0f172a;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}\na{color:#2563eb;text-decoration:none;} a:hover{color:#1d4ed8;text-decoration:underline;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:flex;flex-direction:column;height:100vh;overflow:hidden;\">\n  <div data-screen-label=\"Header\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:#ffffff;border-bottom:1px solid #e2e8f0;flex-shrink:0;\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;\">\n      <div style=\"font:700 17px 'Space Grotesk',sans-serif;letter-spacing:-0.2px;\">Signal Factory<\u002Fdiv>\n      <div style=\"font:400 12px 'IBM Plex Mono',monospace;color:#64748b;\">Data Observability Platform v2.0 — process &amp; architecture<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:6px;\">\n      <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"10\">\n        <div sc-camel-on-click=\"{{ d.go }}\" title=\"{{ d.label }}\" style=\"{{ d.style }}\"><\u002Fdiv>\n      <\u002Fsc-for>\n      <div sc-camel-on-click=\"{{ goExplore }}\" style=\"margin-left:10px;font:500 11px 'IBM Plex Mono',monospace;color:{{ exploreColor }};cursor:pointer;border:1px solid #e2e8f0;border-radius:999px;padding:4px 10px;background:{{ exploreBg }};\">EXPLORE<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:clamp(270px,30vw,400px) minmax(0,1fr);flex:1;min-height:0;\">\n    <div data-screen-label=\"Narrative panel\" style=\"background:#ffffff;border-right:1px solid #e2e8f0;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px;\">\n      <sc-if value=\"{{ tour }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#2563eb;letter-spacing:1px;\">STEP {{ stepNum }} OF 10 · GUIDED TOUR<\u002Fdiv>\n        <div style=\"font:700 22px/1.2 'Space Grotesk',sans-serif;letter-spacing:-0.4px;\">{{ stepTitle }}<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:#334155;\">{{ stepNarrative }}<\u002Fdiv>\n\n        <sc-if value=\"{{ s0 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border:1px solid #e2e8f0;border-radius:10px;\">\n            <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr;font:600 10px 'IBM Plex Mono',monospace;color:#64748b;background:#f8fafc;padding:8px 12px;letter-spacing:0.5px;border-radius:10px 10px 0 0;\"><div>METRIC<\u002Fdiv><div>TODAY<\u002Fdiv><div style=\"color:#2563eb;\">TARGET<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr;padding:8px 12px;font-size:12px;border-top:1px solid #f1f5f9;\"><div style=\"color:#334155;\">RCA query time<\u002Fdiv><div style=\"color:#b91c1c;\">30–60 min<\u002Fdiv><div style=\"font-weight:600;color:#15803d;\">&lt; 2 min<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr;padding:8px 12px;font-size:12px;border-top:1px solid #f1f5f9;\"><div style=\"color:#334155;\">Time to detect<\u002Fdiv><div style=\"color:#b91c1c;\">4–6 hrs<\u002Fdiv><div style=\"font-weight:600;color:#15803d;\">&lt; 15 min<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr;padding:8px 12px;font-size:12px;border-top:1px solid #f1f5f9;\"><div style=\"color:#334155;\">Time to resolve<\u002Fdiv><div style=\"color:#b91c1c;\">12+ hrs<\u002Fdiv><div style=\"font-weight:600;color:#15803d;\">&lt; 2 hrs<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr;padding:8px 12px;font-size:12px;border-top:1px solid #f1f5f9;\"><div style=\"color:#334155;\">False-positive alerts<\u002Fdiv><div style=\"color:#b91c1c;\">60–80%<\u002Fdiv><div style=\"font-weight:600;color:#15803d;\">&lt; 20%<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr;padding:8px 12px;font-size:12px;border-top:1px solid #f1f5f9;\"><div style=\"color:#334155;\">Sprint capacity lost to toil<\u002Fdiv><div style=\"color:#b91c1c;\">~20%<\u002Fdiv><div style=\"font-weight:600;color:#15803d;\">&lt; 5%<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#64748b;line-height:1.5;\">Today, teams discover stale or broken data too late and manually correlate evidence across systems — Slack archaeology, dashboard debugging, repeated triage.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ s1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;\"><div style=\"font:600 12px 'Space Grotesk',sans-serif;\">Never blocks the data path<\u002Fdiv><div style=\"font-size:12px;color:#64748b;margin-top:2px;\">Bad data flows through; the Enforcer emits an evidence record instead of rejecting messages inline. Zero latency added to production.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;\"><div style=\"font:600 12px 'Space Grotesk',sans-serif;\">Zero producer changes to start<\u002Fdiv><div style=\"font-size:12px;color:#64748b;margin-top:2px;\">A sidecar observer consumes events after publication — no team has to change code for baseline coverage.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;\"><div style=\"font:600 12px 'Space Grotesk',sans-serif;\">Every event → exactly one Evidence record<\u002Fdiv><div style=\"font-size:12px;color:#64748b;margin-top:2px;\">Deterministic PASS/FAIL with reason codes, produced in &lt; 2 s P99 — replayable, auditable, trace-anchored.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ s2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;\">\n            <div style=\"display:flex;gap:10px;align-items:center;\"><div style=\"width:10px;height:10px;border-radius:3px;background:#2563eb;flex-shrink:0;\"><\u002Fdiv><div><b>Enforcement<\u002Fb> — establishes per-record truth (3 components)<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;\"><div style=\"width:10px;height:10px;border-radius:3px;background:#0d9488;flex-shrink:0;\"><\u002Fdiv><div><b>Processing<\u002Fb> — aggregates evidence into signals &amp; incidents (2)<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;\"><div style=\"width:10px;height:10px;border-radius:3px;background:#7c3aed;flex-shrink:0;\"><\u002Fdiv><div><b>Knowledge<\u002Fb> — causal graph + operational state (3)<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;\"><div style=\"width:10px;height:10px;border-radius:3px;background:#d97706;flex-shrink:0;\"><\u002Fdiv><div><b>Consumption<\u002Fb> — AI-powered RCA Copilot (1)<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;\"><div style=\"width:10px;height:10px;border-radius:3px;background:#e11d48;flex-shrink:0;\"><\u002Fdiv><div><b>Automation<\u002Fb> — agents that instrument code at source (3)<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#64748b;line-height:1.5;\">Each plane answers a different question: record truth, system health, causality, explanation, and adoption. Click any component now or after the tour for detail.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ s3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:0;\">\n            <div style=\"display:flex;gap:10px;\"><div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#2563eb;width:18px;\">1<\u002Fdiv><div style=\"font-size:12.5px;color:#334155;padding-bottom:10px;border-left:1px solid #e2e8f0;margin-left:-14px;padding-left:14px;\">Raw Kafka event published — production path untouched<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;\"><div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#2563eb;width:18px;\">2<\u002Fdiv><div style=\"font-size:12.5px;color:#334155;padding-bottom:10px;border-left:1px solid #e2e8f0;margin-left:-14px;padding-left:14px;\">Policy Enforcer runs gates G1–G5 (resolution, identity, schema, contract, PII) in &lt; 2 s<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;\"><div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#2563eb;width:18px;\">3<\u002Fdiv><div style=\"font-size:12.5px;color:#334155;padding-bottom:10px;border-left:1px solid #e2e8f0;margin-left:-14px;padding-left:14px;\">Evidence lands on the Evidence Bus — the single source of truth; engines never read raw topics<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;\"><div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#2563eb;width:18px;\">4<\u002Fdiv><div style=\"font-size:12.5px;color:#334155;padding-bottom:10px;border-left:1px solid #e2e8f0;margin-left:-14px;padding-left:14px;\">Signal Engines aggregate over 5-min windows → freshness, volume, contract, drift signals<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;\"><div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#2563eb;width:18px;\">5<\u002Fdiv><div style=\"font-size:12.5px;color:#334155;padding-bottom:10px;border-left:1px solid #e2e8f0;margin-left:-14px;padding-left:14px;\">Alerting Engine groups signals into one incident, routes by severity; causal edges written to the graph<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;\"><div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#2563eb;width:18px;\">6<\u002Fdiv><div style=\"font-size:12.5px;color:#334155;\">RCA Copilot traverses the graph and explains root cause in &lt; 2 min, citing evidence IDs<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:500 11px 'IBM Plex Mono',monospace;color:#64748b;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;\">Throughput: 50K–500K events/sec · evidence &lt; 2s P99 · signals &lt; 5 min<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ s4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"display:flex;gap:8px;align-items:stretch;\">\n              <div style=\"flex:1;background:#fdf6ec;border:1px solid #f0e0c8;border-radius:8px;padding:8px 10px;\"><div style=\"font:600 11px 'Space Grotesk',sans-serif;color:#92600a;\">Bronze<\u002Fdiv><div style=\"font-size:11px;color:#64748b;\">raw · G1+G2+G3 fingerprint<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;background:#f4f6f8;border:1px solid #dde3ea;border-radius:8px;padding:8px 10px;\"><div style=\"font:600 11px 'Space Grotesk',sans-serif;color:#475569;\">Silver<\u002Fdiv><div style=\"font-size:11px;color:#64748b;\">cleaned · G4-lite + G5 + DQ<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;background:#fdf9e7;border:1px solid #efe3ad;border-radius:8px;padding:8px 10px;\"><div style=\"font:600 11px 'Space Grotesk',sans-serif;color:#8a6d00;\">Gold<\u002Fdiv><div style=\"font-size:11px;color:#64748b;\">aggregated · full contract<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid #bbf7d0;background:#f0fdf4;border-radius:10px;padding:10px 14px;\"><div style=\"font:600 12px 'Space Grotesk',sans-serif;color:#15803d;\">All Gold gates PASS → Certified View advances<\u002Fdiv><div style=\"font-size:12px;color:#3f6212;margin-top:2px;\">Consumers always read the last known good version — never speculative.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #fecaca;background:#fef2f2;border-radius:10px;padding:10px 14px;\"><div style=\"font:600 12px 'Space Grotesk',sans-serif;color:#b91c1c;\">Any gate FAILS → data routes to Quarantine<\u002Fdiv><div style=\"font-size:12px;color:#7f1d1d;margin-top:2px;\">Certified View holds at the previous version; bad data never reaches dashboards.<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:12px;color:#64748b;line-height:1.5;\">Batch jobs (Spark/Airflow) emit the same canonical evidence to the same bus — <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;\">run_id<\u002Fspan> plays the role of <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;\">trace_id<\u002Fspan>. One platform, both worlds.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ s5 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;\"><div style=\"font:600 10px 'IBM Plex Mono',monospace;color:#94a3b8;\">14:02 · THE CHANGE<\u002Fdiv><div style=\"font-size:12.5px;color:#334155;margin-top:3px;\"><b>orders-svc v3.17<\u002Fb> deploys and silently drops <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;\">customer_id<\u002Fspan>. Data keeps flowing — nothing is blocked.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;\"><div style=\"font:600 10px 'IBM Plex Mono',monospace;color:#94a3b8;\">14:02 · EVIDENCE<\u002Fdiv><div style=\"font-size:12.5px;color:#334155;margin-top:3px;\">Gate G4 fails every event: <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;background:#fef2f2;color:#b91c1c;padding:1px 5px;border-radius:4px;\">CONTRACT:MISSING_FIELD:customer_id<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;\"><div style=\"font:600 10px 'IBM Plex Mono',monospace;color:#94a3b8;\">14:07 · DETECTION<\u002Fdiv><div style=\"font-size:12.5px;color:#334155;margin-top:3px;\">Contract engine sees the compliance window collapse → one SEV-1 incident (Tier-1 dataset), one PagerDuty page — not ten.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;\"><div style=\"font:600 10px 'IBM Plex Mono',monospace;color:#94a3b8;\">14:09 · ROOT CAUSE<\u002Fdiv><div style=\"font-size:12.5px;color:#334155;margin-top:3px;\">Copilot traverses Deployment → FailureSignature → Signal → Incident: <i>\"v3.17 introduced MISSING_FIELD:customer_id\"<\u002Fi> — with blast radius (7 downstream consumers) and a suggested rollback to v3.16, every claim citing evidence IDs.<\u002Fdiv><\u002Fdiv>\n            <div style=\"font:500 11px 'IBM Plex Mono',monospace;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 12px;\">Detected in 5 min (was 4–6 hrs) · root cause in 2 min (was 30–60 min)<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ s6 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px;color:#334155;line-height:1.55;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;\"><b>The bootstrap problem:<\u002Fb> RCA needs signals, but teams won't invest in signals until they see RCA value. Autopilot breaks the loop by instrumenting code proactively.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:#334155;\">\n            <div style=\"display:flex;gap:10px;\"><div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#e11d48;width:52px;flex-shrink:0;\">SCOUT<\u002Fdiv><div>Clones repos, detects stack &amp; archetype, finds observability gaps, scores confidence<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;\"><div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#e11d48;width:52px;flex-shrink:0;\">AUTHOR<\u002Fdiv><div>Generates instrumentation code from templates, opens PRs, drafts contracts from observed payloads<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;\"><div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#e11d48;width:52px;flex-shrink:0;\">REVIEW<\u002Fdiv><div>Validates against safety rules, runs tests, routes to humans when confidence &lt; 0.8<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;\">\n            <div style=\"font:600 11px 'IBM Plex Mono',monospace;color:#64748b;letter-spacing:0.5px;margin-bottom:6px;\">GUARDRAILS<\u002Fdiv>\n            <div style=\"font-size:12px;color:#334155;line-height:1.7;\">Max 2 PRs/repo/week · auto-merge only at confidence ≥ 0.8 with tests passing · contract changes always human-reviewed · never rolls back deployments · never mutes alerts · LLM spend capped at $500/day<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ s7 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"border:1px solid #e2e8f0;border-left:3px solid #2563eb;border-radius:8px;padding:10px 14px;\"><div style=\"font:600 12.5px 'Space Grotesk',sans-serif;\">Lane A — Zero-change baseline <span style=\"font-weight:400;color:#94a3b8;\">(default for everyone)<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#64748b;margin-top:2px;\">Fast asset discovery, baseline freshness/volume/schema visibility, readiness scoring — no producer changes.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #e2e8f0;border-left:3px solid #0d9488;border-radius:8px;padding:10px 14px;\"><div style=\"font:600 12.5px 'Space Grotesk',sans-serif;\">Lane B — Targeted light-touch push <span style=\"font-weight:400;color:#94a3b8;\">(Tier-1 only)<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#64748b;margin-top:2px;\">Selective, approval-gated producer improvements where baseline evidence isn't enough — trace continuity, attribution, contract truth.<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #e2e8f0;border-left:3px solid #d97706;border-radius:8px;padding:10px 14px;\"><div style=\"font:600 12.5px 'Space Grotesk',sans-serif;\">Lane C — Value attribution <span style=\"font-weight:400;color:#94a3b8;\">(mandatory)<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#64748b;margin-top:2px;\">Leadership scorecards: prevented incidents, MTTD/MTTR gains, Sev cost avoided, dashboards protected.<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:12px;color:#64748b;line-height:1.5;\">This split avoids both failure modes: a shallow baseline that never earns trust, or a heavy instrumentation push that never scales.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ s8 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\">\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:12px;\"><div style=\"font:700 20px 'Space Grotesk',sans-serif;color:#15803d;\">&lt; 15 min<\u002Fdiv><div style=\"font-size:11px;color:#64748b;\">MTTD (from 4–6 hrs)<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:12px;\"><div style=\"font:700 20px 'Space Grotesk',sans-serif;color:#15803d;\">&lt; 2 hrs<\u002Fdiv><div style=\"font-size:11px;color:#64748b;\">MTTR (from 12+ hrs)<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:12px;\"><div style=\"font:700 20px 'Space Grotesk',sans-serif;color:#15803d;\">&lt; 2 min<\u002Fdiv><div style=\"font-size:11px;color:#64748b;\">RCA query (from 30–60 min)<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:12px;\"><div style=\"font:700 20px 'Space Grotesk',sans-serif;color:#15803d;\">&lt; 20%<\u002Fdiv><div style=\"font-size:11px;color:#64748b;\">False positives (from 60–80%)<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:12px;color:#334155;line-height:1.6;\">Judged on outcomes — not PR count, dashboard count, or SDK installs. The scorecard also tracks prevented schema issues, stale-data exposures avoided, engineering hours recovered, and Sev cost avoided.<br><span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#64748b;\">Infra cost: ~$21K/month · 99.5%+ availability<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ s9 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#334155;\">\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2563eb;font-weight:700;\">1<\u002Fspan><div>Name a <b>pilot domain<\u002Fb> (e.g. Orders) with explicit success criteria — 90-day proof of value<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2563eb;font-weight:700;\">2<\u002Fspan><div>Staff a <b>tiger team<\u002Fb> for the first 90 days; transition to functional lanes once proven<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2563eb;font-weight:700;\">3<\u002Fspan><div>Back an <b>executive merge SLA<\u002Fb> for Tier-1 instrumentation PRs<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2563eb;font-weight:700;\">4<\u002Fspan><div>Require a <b>visible scorecard<\u002Fb> tied to incident reduction and prevention<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2563eb;font-weight:700;\">5<\u002Fspan><div>Insist on <b>trust-tiering<\u002Fb>: inferred vs platform-attested vs producer-attested signals<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2563eb;font-weight:700;\">6<\u002Fspan><div><b>Observability-of-observability<\u002Fb> — the platform monitors its own evidence chain<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\"><span style=\"color:#2563eb;font-weight:700;\">7<\u002Fspan><div>Hold a <b>hard MVP boundary<\u002Fb> — prove value before broadening scope<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#64748b;\">Approve the hybrid operating model; budget ~$21K/month infrastructure; judge by MTTD, MTTR, deterministic-RCA rate, and prevented impact.<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ goExplore }}\" style=\"background:#2563eb;color:#fff;border-radius:8px;padding:10px 16px;text-align:center;font:600 13px 'Space Grotesk',sans-serif;cursor:pointer;\">Finish tour → explore the architecture<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:auto;display:flex;gap:8px;padding-top:14px;\">\n          <div sc-camel-on-click=\"{{ prev }}\" style=\"flex:1;text-align:center;border:1px solid #e2e8f0;border-radius:8px;padding:9px 0;font:600 12.5px 'Space Grotesk',sans-serif;color:{{ prevColor }};cursor:pointer;background:#fff;\">← Back<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ next }}\" style=\"flex:2;text-align:center;border-radius:8px;padding:9px 0;font:600 12.5px 'Space Grotesk',sans-serif;color:#fff;background:#2563eb;cursor:pointer;\">{{ nextLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if ter-spacing:1.5px;color:#d97706;margin-bottom:8px;\">CONSUMPTION PLANE · answers in minutes<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ p9 }}\" style=\"opacity:{{ o9 }};outline:{{ l9 }};outline-offset:2px;border-radius:10px;transition:opacity .25s;\">\n              <div style=\"background:#fff;border:1px solid #fef3c7;border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;\">\n                <div>\n                  <div><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#94a3b8;\">C-09 <\u002Fspan><span style=\"font:600 13px 'Space Grotesk',sans-serif;\">RCA Copilot<\u002Fspan><span style=\"font:400 10px 'IBM Plex Mono',monospace;color:#94a3b8;\"> · Claude via Bedrock<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:11px;color:#64748b;margin-top:2px;\">Root cause + blast radius + suggested fix, evidence-grounded — says \"unknown\" rather than guess<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font:600 12px 'IBM Plex Mono',monospace;color:#15803d;white-space:nowrap;\">RCA &lt; 2 min<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff1f2;border:1px solid #ffe4e6;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-self:start;flex:1 1 190px;max-width:230px;box-sizing:border-box;\">\n          <div style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:1.5px;color:#e11d48;\">AUTOMATION PLANE · adoption engine<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#9f1239;line-height:1.45;\">Breaks the bootstrap problem: instruments producers so signals exist before teams invest.<\u002Fdiv>\n          <div style=\"border:1px dashed #fda4af;border-radius:8px;padding:7px 10px;font:500 10.5px 'IBM Plex Mono',monospace;color:#9f1239;background:#fff;\">Your repos (GitHub)<\u002Fdiv>\n          <div style=\"text-align:center;font:500 10px 'IBM Plex Mono',monospace;color:#9f1239;\">↓ scan<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ p11 }}\" style=\"opacity:{{ o11 }};outline:{{ l11 }};outline-offset:2px;border-radius:10px;transition:opacity .25s;\">\n            <div style=\"background:#fff;border:1px solid #ffe4e6;border-radius:10px;padding:9px 11px;cursor:pointer;\">\n              <div><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#94a3b8;\">C-11 <\u002Fspan><span style=\"font:600 12.5px 'Space Grotesk',sans-serif;\">Scout Agent<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:10.5px;color:#64748b;margin-top:2px;\">Detects stack, finds gaps, scores confidence<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;font:500 10px 'IBM Plex Mono',monospace;color:#9f1239;\">↓ gap report<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ p12 }}\" style=\"opacity:{{ o12 }};outline:{{ l12 }};outline-offset:2px;border-radius:10px;transition:opacity .25s;\">\n            <div style=\"background:#fff;border:1px solid #ffe4e6;border-radius:10px;padding:9px 11px;cursor:pointer;\">\n              <div><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#94a3b8;\">C-12 <\u002Fspan><span style=\"font:600 12.5px 'Space Grotesk',sans-serif;\">Author / Review<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:10.5px;color:#64748b;margin-top:2px;\">Generates instrumentation PRs, validates, routes to humans &lt; 0.8 confidence<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;font:500 10px 'IBM Plex Mono',monospace;color:#9f1239;\">↕ coordinates<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ p10 }}\" style=\"opacity:{{ o10 }};outline:{{ l10 }};outline-offset:2px;border-radius:10px;transition:opacity .25s;\">\n            <div style=\"background:#fff;border:1px solid #ffe4e6;border-radius:10px;padding:9px 11px;cursor:pointer;\">\n              <div><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#94a3b8;\">C-10 <\u002Fspan><span style=\"font:600 12.5px 'Space Grotesk',sans-serif;\">Orchestrator<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:10.5px;color:#64748b;margin-top:2px;\">Prioritizes repos, enforces guardrails, escalates to humans<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #ffe4e6;padding-top:8px;font-size:10.5px;color:#9f1239;line-height:1.45;\">← PRs instrument the estate, feeding richer evidence back into the platform<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tour&quot;,&quot;explore&quot;],&quot;default&quot;:&quot;tour&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;dimOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.3,&quot;min&quot;:0.1,&quot;max&quot;:0.7,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  state = { step: 0, explore: false, sel: null };\n  componentDidMount() { if ((this.props.startMode ?? 'tour') === 'explore') this.setState({ explore: true }); }\n  renderVals() {\n    const ACC = '#2563eb';\n    const PLANES = { Enforcement: '#2563eb', Processing: '#0d9488', Knowledge: '#7c3aed', Consumption: '#d97706', Automation: '#e11d48' };\n    const COMP = {\n      c1: { name: 'C-01 Policy Enforcer', plane: 'Enforcement', team: 'Platform Core', tag: 'The cornerstone. A sidecar observer that consumes events after publication and runs five deterministic validation gates — never blocking production data.', facts: ['Gates: G1 Resolution → G2 Identity → G3 Schema (Glue) → G4 Contract (ODCS) → G5 PII', 'Every raw event produces exactly one evidence record — a pure function, replayable for debugging', 'Preserves trace_id and computes a schema fingerprint for last-good vs first-bad RCA', 'Degrades gracefully when the Registry or Control Plane is unavailable'] },\n      c2: { name: 'C-02 Gateway Control Plane', plane: 'Enforcement', team: 'Platform Core', tag: 'The configuration brain: dataset registry, tier classification, schema bindings, contracts, and SLOs. Never on the critical data path.', facts: ['Single source of truth for dataset policies — prevents inconsistency across Enforcers', 'All changes versioned and auditable with rollback; Tier-1 SLO changes need human approval', 'API-first so Autopilot agents and CI/CD can manage config programmatically', 'Enforcers cache config locally with TTL refresh — outages never block evidence'] },\n      c3: { name: 'C-03 Evidence Bus', plane: 'Enforcement', team: 'Platform Core', tag: 'The sole, non-negotiable API for everything downstream: the signal_factory.evidence Kafka topic — an immutable record of every validation result.', facts: ['Signal Engines MUST NOT consume raw business topics — evidence only', 'Sized for 500K events/sec (64 partitions, MSK); 99.9% availability', 'Replay capability for incident investigation; archived to S3 (hot → warm → cold)', 'Canonical schema: evidence_id, dataset URN, producer + confidence, failed gates, reason codes, trace_id'] },\n      c4: { name: 'C-04 Signal Engine Framework', plane: 'Processing', team: 'Signal Processing', tag: 'Turns the firehose of per-record evidence into actionable health signals using 5-minute tumbling windows — balancing responsiveness with signal-to-noise.', facts: ['MVP: Freshness (pipeline stoppage), Volume (drops/spikes vs 7-day baseline), Contract compliance + drift', 'Each engine scales and deploys independently with its own consumer group', 'Later engines: DQ aggregation, ML anomaly detection, cost anomaly', 'Signal freshness SLO: < 5 minutes'] },\n      c5: { name: 'C-05 Alerting Engine', plane: 'Processing', team: 'Signal Processing', tag: 'Turns signals into incidents without alert fatigue: 10 signals from 1 root cause become 1 incident, not 10 pages.', facts: ['Routes by severity: SEV-1 → PagerDuty, SEV-2 → Slack, SEV-3 → Jira', 'Groups by root cause via FailureSignature correlation (5-min dedup window)', 'Rate-limited: max 10 alerts/hour/team to prevent storms', 'Tracks false-positive rate for continuous threshold tuning — target < 20%'] },\n      c6: { name: 'C-06 Neptune Graph Store', plane: 'Knowledge', team: 'Signal Processing', tag: 'The causal memory. Stores relationships, not raw data — optimized for \"why did this happen?\" traversals.', facts: ['RCA path: Deployment —INTRODUCED→ FailureSignature —CAUSED→ Signal —TRIGGERED→ Incident', 'Bounded cardinality: FailureSignature deduplication; per-record nodes prohibited', 'Lineage edges from SCA: Job READS/WRITES Dataset, down to column level', 'Blast-radius queries < 500ms P95'] },\n      c7: { name: 'C-07 DynamoDB State Store', plane: 'Knowledge', team: 'Signal Processing', tag: 'Operational truth for fast dashboards: answers \"what is the current health?\" while Neptune answers \"why?\"', facts: ['Tables: SignalState, IncidentIndex, DatasetRegistry, EvidenceCache', 'Lineage indexes: DatasetToWriters / DatasetToReaders for instant impact lookups', 'Hot evidence cached for sub-second RCA context retrieval'] },\n      c8: { name: 'C-08 Lineage Ingestor', plane: 'Knowledge', team: 'AI & Intelligence', tag: 'Bridges design-time intent (what code should read/write, from static code analysis) with runtime truth.', facts: ['Consumes LineageSpec artifacts: producer, input/output datasets and columns, confidence, commit SHA', 'Column-level precision: \"which field change broke which consumers?\"', 'Asynchronous by design — stale lineage never blocks alerting or incidents', 'Low-confidence edges are marked, never presented as certain'] },\n      c9: { name: 'C-09 RCA Copilot', plane: 'Consumption', team: 'AI & Intelligence', tag: 'The primary value delivery: an AI assistant that explains incidents in minutes, reasoning only over deterministic graph data.', facts: ['Every claim cites evidence IDs; if the graph lacks an edge it says \"unknown\" — never fabricates', 'Output: root-cause statement, blast radius ranked by confidence, timeline, suggested actions (e.g. rollback)', 'Claude via AWS Bedrock; accuracy gate: ≥ 70% top-3 on 50 ground-truth incidents', 'RCA query latency < 2 minutes (from 30–60 minutes today)'] },\n      c10: { name: 'C-10 Autopilot Orchestrator', plane: 'Automation', team: 'Autopilot', tag: 'Coordinates Scout, Author, and Review agents — prioritizing repositories and keeping automation inside hard guardrails.', facts: ['Max 2 PRs/repo/week; max 10 PRs during any SEV-1/2 incident', 'Auto-merge only at confidence ≥ 0.8 with tests passing', 'Never rolls back deployments or mutes alerts — propose only', 'LLM cost capped at $500/day'] },\n      c11: { name: 'C-11 Scout Agent', plane: 'Automation', team: 'Autopilot', tag: 'Repository analysis: clones repos, detects the tech stack and archetype, and finds observability gaps.', facts: ['Archetype matching: Kafka producer, Spark job, REST API, etc.', 'Assesses existing OTel coverage, trace propagation, contracts', 'Confidence scoring from signal clarity, dependency versions, test coverage', 'Output: a structured GapReport per repository'] },\n      c12: { name: 'C-12 Author & Review Agents', plane: 'Automation', team: 'Autopilot', tag: 'Author generates instrumentation code and PRs from vetted templates; Review validates, tests, and manages the human liaison.', facts: ['Language-specific templates: Spring starter, OpenLineage for Spark', 'Drafts contract definitions from observed payloads', 'Routes to human review whenever confidence < 0.8', 'Feedback loop tunes confidence scoring over time'] }\n    };\n    const STEPS = [\n      { t: 'Why we need this now', n: 'Every data incident today is a manual investigation. The numbers below are the cost of staying reactive — and the committed targets of this platform.', hl: null },\n      { t: 'The core idea: out-of-band enforcement', n: 'Validation happens after data is published — never inline. This one decision makes the rollout safe, fast, and friction-free for producer teams.', hl: ['c1', 'c2', 'c3'] },\n      { t: 'Five planes, twelve components', n: 'The whole platform is 12 components across 5 planes, each with a single clear job and a named owning team. ~$21K/month infrastructure.', hl: null },\n      { t: 'Follow one event (streaming)', n: 'The highlighted path is the life of a single Kafka event through the platform:', hl: ['c1', 'c3', 'c4', 'c5', 'c6', 'c9'] },\n      { t: 'The same spine handles batch', n: 'Spark and Airflow jobs validate at each medallion boundary and emit to the same Evidence Bus. Consumers only ever see certified data.', hl: ['c3', 'c4', 'c7'] },\n      { t: 'A bad deploy, minute by minute', n: 'What the platform does when orders-svc ships a breaking change — the scenario leadership should pressure-test:', hl: ['c1', 'c3', 'c4', 'c5', 'c6', 'c9'] },\n      { t: 'Autopilot breaks the bootstrap problem', n: 'Three agents instrument the estate automatically — under hard guardrails, with humans in the loop for anything high-impact.', hl: ['c10', 'c11', 'c12'] },\n      { t: 'How we roll it out: three lanes', n: 'A hybrid operating model that separates broad onboarding, precision enhancement, and business proof:', hl: null },\n      { t: 'What success looks like', n: 'The program is judged on operational outcomes, reported on a recurring leadership scorecard:', hl: null },\n      { t: 'What we need from leadership', n: 'Seven commitments, starting with a 90-day proof of value in one pilot domain:', hl: null }\n    ];\n    const { step, explore, sel } = this.state;\n    const dim = this.props.dimOpacity ?? 0.3;\n    const cur = STEPS[step];\n    const hlSet = !explore && cur.hl ? new Set(cur.hl) : null;\n    const vals = {\n      tour: !explore, explore, stepNum: step + 1,\n      stepTitle: cur.t, stepNarrative: cur.n,\n      nextLabel: step < 9 ? 'Next →' : 'Explore the architecture →',\n      prevColor: step > 0 ? '#334155' : '#cbd5e1',\n      next: () => step < 9 ? this.setState({ step: step + 1 }) : this.setState({ explore: true }),\n      prev: () => step > 0 && this.setState({ step: step - 1 }),\n      goExplore: () => this.setState({ explore: true }),\n      backToTour: () => this.setState({ explore: false, sel: null, step: 0 }),\n      exploreColor: explore ? '#fff' : '#64748b',\n      exploreBg: explore ? '#e11d48' : '#fff',\n      dots: STEPS.map((s, i) => ({\n        label: s.t,\n        go: () => this.setState({ explore: false, step: i, sel: null }),\n        style: { width: 8, height: 8, borderRadius: 99, cursor: 'pointer', transition: 'all .2s', background: !explore && i === step ? ACC : '#cbd5e1' }\n      })),\n      noSel: explore && !sel, hasSel: explore && !!sel\n    };\n    for (let i = 0; i < 10; i++) vals['s' + i] = !explore && step === i;\n    for (let i = 1; i <= 12; i++) {\n      const k = 'c' + i;\n      vals['o' + i] = hlSet ? (hlSet.has(k) ? 1 : dim) : 1;\n      vals['l' + i] = (hlSet && hlSet.has(k)) || (explore && sel === k) ? '2px solid ' + PLANES[COMP[k].plane] : 'none';\n      vals['p' + i] = () => this.setState({ explore: true, sel: k });\n    }\n    if (sel) {\n      const c = COMP[sel];\n      vals.selName = c.name; vals.selPlane = c.plane.toUpperCase() + ' PLANE'; vals.selPlaneColor = PLANES[c.plane];\n      vals.selTeam = 'Team: ' + c.team; vals.selTag = c.tag; vals.selFacts = c.facts;\n    } else { vals.selFacts = []; }\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
